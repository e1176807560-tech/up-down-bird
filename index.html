<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bird Frame Animation</title>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#111;
  color:#eee;
  font-family:Arial,"Microsoft YaHei",sans-serif;
}

body{
  overflow:hidden;
}

#canvas-wrap{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  object-fit:cover;
}
</style>

</head>

<body>

<div id="canvas-wrap"></div>

<script src="sketch.js"></script>

</body>
</html>
