<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bird Frame Animation</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #f5f5f5;
    color: #eee;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    cursor: none;
  }
  #canvas-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    box-shadow: 0 0 40px rgba(0,0,0,0.12);
    cursor: none;
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<script src="sketch.js"></script>
</body>
</html>
